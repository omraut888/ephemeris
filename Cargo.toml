[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop crate compiles Tauri (hundreds of crates), and the FFI crate
# UniFFI; keep both out of a plain `cargo build`/`test`/`clippy`. Build them
# with `-p` (docs/phase4-design.md §4, docs/phase3-design.md §1).
default-members = [
    "crates/ephemeris-core",
    "crates/ephemeris-cli",
    "crates/ephemeris-wasm",
    "crates/ephemeris-sync",
    "crates/ephemeris-sync-wasm",
]

# The engine optimized even in dev builds: `tauri dev` runs the forecast
# natively, and unoptimized it is several times slower. f64 results do not
# depend on the optimization level (no fast-math), so tests still match the
# golden files.
[profile.dev.package.ephemeris-core]
opt-level = 3

# The sync crate's convergence simulation seals, opens and merges thousands
# of states; unoptimized JSON and cipher code make it several times slower.
[profile.dev.package.ephemeris-sync]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

# The sync crate is built for size: it merges a few thousand records at
# most, and its WASM module is 487 kB at opt-level 3 against 422 kB here
# (gzip 189 against 171 kB; docs/phase4b-design.md §10). The engine stays
# at opt-level 3.
[profile.release.package.ephemeris-sync]
opt-level = "z"
