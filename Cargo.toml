[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop crate compiles Tauri (hundreds of crates); keep it out of a
# plain `cargo build`/`test`/`clippy`. Build it with `-p ephemeris-desktop`
# (docs/phase4-design.md §4).
default-members = [
    "crates/ephemeris-core",
    "crates/ephemeris-cli",
    "crates/ephemeris-wasm",
]

[profile.release]
lto = true
codegen-units = 1
