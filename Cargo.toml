[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop crate compiles Tauri (hundreds of crates), and the FFI crate
# UniFFI; keep both out of a plain `cargo build`/`test`/`clippy`. Build them
# with `-p` (docs/phase4-design.md §4, docs/phase3-design.md §1).
default-members = [
    "crates/ephemeris-core",
    "crates/ephemeris-cli",
    "crates/ephemeris-wasm",
    "crates/ephemeris-sync",
]

# The engine optimized even in dev builds: `tauri dev` runs the forecast
# natively, and unoptimized it is several times slower. f64 results do not
# depend on the optimization level (no fast-math), so tests still match the
# golden files.
[profile.dev.package.ephemeris-core]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
