[package]
name = "ephemeris-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for ephemeris-core: JSON in, JSON out"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ephemeris-core = { version = "0.1.0", path = "../ephemeris-core", features = ["serde"] }
# The same JSON writer as the CLI, so native and WASM emit the same bytes.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Exports the functions to JavaScript (docs/phase2-design.md §2).
wasm-bindgen = "0.2"

[dev-dependencies]
# Runs the byte-identity assertions inside WASM under Node.
wasm-bindgen-test = "0.3"
# The schema types with their TypeScript declarations, for the drift test
# against web/src/schema.gen.ts (docs/phase2-design.md §3).
ephemeris-core = { version = "0.1.0", path = "../ephemeris-core", features = ["serde", "ts"] }
ts-rs = "12"
