[package]
name = "ephemeris-core"
version = "0.1.0"
edition = "2024"

[features]
# Serde types for the versioned JSON contracts (feed in, forecast report out).
# Off by default so WASM/UniFFI builds that do not need JSON stay lean.
serde = ["dep:serde"]
# TypeScript declarations for the JSON contracts, generated by ts-rs. Only
# ephemeris-wasm's tests enable it, to check web/src/schema.gen.ts for drift
# (docs/phase2-design.md §3); no shipped build compiles it.
ts = ["serde", "dep:ts-rs"]
# JSON text in, JSON text out: the one entry point every shell calls (WASM,
# desktop), so they all emit the same bytes (docs/phase4-design.md §2).
json = ["serde", "dep:serde_json"]

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
# Pure-Rust erfc/log/sqrt for the truncated normal, bit-identical natively and
# in WASM. Already in the graph through nalgebra and rand_distr.
libm = "0.2.16"
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
# No default features: its `std` feature links std into the crate, and then
# its f64 normal and exponential samplers call std's exp/ln (the platform's
# libm natively, Rust's port in WASM), which differ by an ulp on some inputs.
# Without it, they go through num-traits' `libm` path, pure Rust everywhere
# (paper/PLAN.md §11, C1). Keep `std` and `std_math` off.
rand_distr = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
# Only with `json`; already in the graph through the CLI and WASM crates.
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
# Round-trip tests for the `schema` JSON contracts.
serde_json = { version = "1", features = ["float_roundtrip"] }
