# The iOS app's Xcode project (docs/phase3-design.md §5). The .xcodeproj is
# generated and gitignored:
#
#   scripts/build-ios.sh --sim-only          # the engine XCFramework first
#   xcodegen generate --spec ios/project.yml
#
# Simulator only for now: signed to run locally, no team.
name: Ephemeris
options:
  bundleIdPrefix: dev.ephemeris
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EphemerisKit:
    path: EphemerisKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # The engine is built for the Apple-silicon simulator only
    # (aarch64-apple-ios-sim); there is no x86_64 slice to link.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Ephemeris:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: EphemerisKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ephemeris.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EPHEMERIS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Ephemeris:
    build:
      targets:
        Ephemeris: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: EphemerisKit/EphemerisKitTests
